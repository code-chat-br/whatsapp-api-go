          format: int32
          minimum: 1
          example: 42
        token:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        instanceId:
          type: integer
          format: int32
          minimum: 1
          example: 42
    CreateInstanceRequest:
      type: object
      properties:
        instanceName:
          type: string
          maxLength: 255
          nullable: true
