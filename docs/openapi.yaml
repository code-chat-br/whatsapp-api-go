        instanceName:
          type: string
          minLength: 1
          example: codechat
        connectionStatus:
          '$ref': '#/components/schemas/ConnectionStatus'
        alreadyConnected:
          type: boolean
        alreadyConnecting:
          type: boolean
        ownerJid:
          type: string
          minLength: 1
          example: '5511999999999@s.whatsapp.net'
    PasskeyChallenge:
      type: object
      required:
        - requestId
        - state
        - expiresAt
        - publicKey
      properties:
        requestId:
          type: string
          format: uuid
        state:
          type: string
          example: AWAITING_ASSERTION
        expiresAt:
          type: string
          format: date-time
        publicKey:
          type: object
          required:
            - challenge
            - timeout
            - rpId
            - allowCredentials
            - userVerification
            - extensions
          properties:
            challenge:
              type: string
            timeout:
              type: integer
              format: int64
            rpId:
              type: string
            allowCredentials:
              type: array
              items:
                type: object
                required:
                  - id
                  - type
                  - transports
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  transports:
                    type: array
                    items:
                      type: string
                    nullable: true
              nullable: true
            userVerification:
              type: string
            extensions:
              type: object
              additionalProperties: true
              nullable: true
    PasskeyAssertionRequest:
      type: object
      required:
        - requestId
        - assertion
      properties:
        requestId:
          type: string
          format: uuid
        assertion:
          type: object
          required:
            - id
            - rawId
            - type
            - response
          properties:
            id:
              type: string
              minLength: 1
            rawId:
              type: string
              minLength: 1
              description: Unpadded base64url.
            type:
              type: string
              enum:
                - public-key
            response:
              type: object
              required:
                - clientDataJSON
                - authenticatorData
                - signature
              properties:
                clientDataJSON:
                  type: string
                  minLength: 1
                  description: Unpadded base64url.
                authenticatorData:
                  type: string
                  minLength: 1
                  description: Unpadded base64url.
                signature:
                  type: string
                  minLength: 1
                  description: Unpadded base64url.
                userHandle:
                  type: string
                  minLength: 1
                  description: Unpadded base64url.
                  nullable: true
              additionalProperties: false
          additionalProperties: false
      additionalProperties: false
    Message:
      type: object
      required:
        - id
        - keyId
        - keyRemoteJid
        - keyLid
        - keyFromMe
        - keyParticipant
        - keyParticipantLid
        - pushName
        - messageType
        - content
        - messageTimestamp
        - device
        - isGroup
        - instanceId
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          example: 42
        keyId:
          type: string
          minLength: 1
        keyRemoteJid:
          type: string
          minLength: 1
          example: '5511999999999@s.whatsapp.net'
          nullable: true
        keyLid:
          type: string
          nullable: true
        keyFromMe:
          type: boolean
        keyParticipant:
          type: string
          minLength: 1
          example: '5511999999999@s.whatsapp.net'
          nullable: true
        keyParticipantLid:
          type: string
          nullable: true
        pushName:
          type: string
          nullable: true
        messageType:
          type: string
          example: conversation
        content: {}
        messageTimestamp:
          type: integer
          format: int32
          description: Unix timestamp in seconds.
        device:
          type: string
          enum:
            - ios
            - android
            - web
            - unknown
            - desktop
        isGroup:
          type: boolean
          nullable: true
        instanceId:
          type: integer
          format: int32
          minimum: 1
          example: 42
        metadata: {}
        externalAttributes:
          type: object
          additionalProperties: true
    MessageList:
      type: object
      required:
        - messages
      properties:
        messages:
          type: object
          required:
            - total
            - pages
            - currentPage
            - records
          properties:
            total:
              type: integer
              format: int64
            pages:
              type: integer
              format: int64
            currentPage:
              type: integer
              format: int64
            records:
              type: array
              nullable: true
              description: A lookup by where.id returns null here when the record is missing.
              items:
                allOf:
                  - '$ref': '#/components/schemas/Message'
                  - type: object
                    required:
                      - MessageUpdate
                    properties:
                      MessageUpdate:
                        type: array
                        items:
                          type: object
                          required:
                            - status
                            - dateTime
                          properties:
                            status:
                              type: string
                            dateTime:
                              type: string
                              format: date-time
    FindMessagesRequest:
      type: object
      properties:
        where:
          type: object
          properties:
            id:
              type: integer
              format: int32
              minimum: 1
            keyid:
              type: string
              minLength: 1
            keyId:
              type: string
              minLength: 1
            keyRemoteJid:
              type: string
              minLength: 1
              example: '5511999999999@s.whatsapp.net'
            keyFromMe:
              oneOf:
                - type: boolean
                - type: string
                  enum:
                    - 'true'
                    - 'false'
            messageType:
              type: string
            device:
              type: string
              enum:
                - ios
                - android
                - web
                - unknown
                - desktop
            messageStatus:
              type: string
            messageTimestampGte:
              type: integer
              format: int32
              minimum: 0
            messageTimestampLte:
              type: integer
              format: int32
              minimum: 0
        offset:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          default: 20
          description: Page size. Zero uses the default.
        page:
          type: integer
          format: int32
          minimum: 0
          default: 1
          description: Page number starting at one. Zero uses the default.
    ReadMessagesRequest:
      description: Supply local message IDs or supply a sender, chat and list of WhatsApp message IDs.
      oneOf:
        - type: object
          required:
            - ids
          properties:
            ids:
              type: array
              items:
                type: integer
                format: int32
                minimum: 1
              minItems: 1
          not:
            anyOf:
              - required: [sender]
              - required: [chat]
              - required: [messageIds]
        - type: object
          required:
            - sender
            - chat
            - messageIds
          properties:
            sender:
              type: string
              minLength: 1
              example: '5511999999999@s.whatsapp.net'
            chat:
              type: string
              minLength: 1
              example: '5511999999999@s.whatsapp.net'
            messageIds:
              type: array
              items:
                type: string
                minLength: 1
              minItems: 1
          not:
            required: [ids]
    ArchiveChatRequest:
      type: object
      required:
        - lastMessage
        - archive
      properties:
        lastMessage:
          type: object
          required:
            - key
          properties:
            key:
              type: object
              required:
                - remoteJid
                - fromMe
                - id
              properties:
                remoteJid:
                  type: string
                  minLength: 1
                  example: '5511999999999@s.whatsapp.net'
                fromMe:
                  type: boolean
                id:
                  type: string
                  minLength: 1
        archive:
          type: boolean
    EditMessageRequest:
      type: object
      required:
        - id
        - text
      properties:
        id:
          oneOf:
            - type: integer
              format: int32
              minimum: 1
            - type: string
              minLength: 1
          description: Local message ID as an integer or WhatsApp key ID as a string.
        text:
          type: string
          minLength: 1
          maxLength: 65536
          description: 'Replacement text, limited to 65536 UTF-8 bytes.'
    MediaDataRequest:
      description: Supply a local ID, a WhatsApp key ID, or a media payload with an optional key ID.
      oneOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int32
              minimum: 1
          not:
            anyOf:
              - required: [keyId]
              - required: [messageType]
              - required: [content]
        - type: object
          required:
            - keyId
          properties:
            keyId:
              type: string
              minLength: 1
              maxLength: 256
          not:
            anyOf:
              - required: [id]
              - required: [messageType]
              - required: [content]
        - type: object
          required:
            - messageType
            - content
          properties:
            messageType:
              type: string
              enum:
                - imageMessage
                - videoMessage
                - documentMessage
                - stickerMessage
                - audioMessage
            content:
              type: object
              additionalProperties: true
              minProperties: 1
            keyId:
              type: string
              minLength: 1
              maxLength: 256
          not:
            required: [id]
    GroupParticipant:
      type: object
      required:
        - id
        - isAdmin
        - isSuperAdmin
      properties:
        id:
          type: string
          minLength: 1
          example: '5511999999999@s.whatsapp.net'
        phoneNumber:
          type: string
          minLength: 1
          example: '5511999999999@s.whatsapp.net'
        lid:
          type: string
        isAdmin:
          type: boolean
        isSuperAdmin:
          type: boolean
        displayName:
          type: string
        error:
          type: integer
          format: int32
    GroupInfo:
