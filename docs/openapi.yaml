        - announce
        - isCommunity
        - isCommunityAnnounce
        - joinApprovalMode
        - memberAddMode
        - participants
      properties:
        id:
          type: string
          minLength: 1
          example: '120363000000000000@g.us'
        subject:
          type: string
        subjectOwner:
          type: string
          minLength: 1
          example: '5511999999999@s.whatsapp.net'
        subjectTime:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        creation:
          type: integer
          format: int64
        owner:
          type: string
          minLength: 1
          example: '5511999999999@s.whatsapp.net'
        desc:
          type: string
        descId:
          type: string
        restrict:
          type: boolean
        announce:
          type: boolean
        isCommunity:
          type: boolean
        isCommunityAnnounce:
          type: boolean
        joinApprovalMode:
          type: boolean
        memberAddMode:
          type: boolean
        participants:
          type: array
          items:
            '$ref': '#/components/schemas/GroupParticipant'
    RecipientFields:
      type: object
      description: Supply exactly one nonempty recipient alias. Use a phone number or a WhatsApp JID.
      oneOf:
        - required: [number]
          properties:
            number: {type: string, minLength: 1}
        - required: [chat]
          properties:
            chat: {type: string, minLength: 1}
        - required: [recipient]
          properties:
            recipient: {type: string, minLength: 1}
      properties:
        number:
          type: string
          nullable: true
        chat:
          type: string
          nullable: true
        recipient:
          type: string
          nullable: true
