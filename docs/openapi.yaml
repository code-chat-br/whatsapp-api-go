components:
  securitySchemes:
    globalApiKey:
      type: apiKey
      in: header
      name: apikey
      description: Global administration token. Header names are case-insensitive.
    globalApiKeyAlias:
      type: apiKey
      in: header
      name: x-api-key
      description: 'Alternative header for the global administration token. If both headers are sent, their values must match.'
    instanceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    InstanceName:
      name: instanceName
      in: path
      required: true
      schema:
        type: string
  responses:
    InvalidInput:
      description: 'Invalid request body, parameter or input.'
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The token does not authorize this operation on the requested instance.
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested instance or related resource was not found.
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorResponse'
    NotAcceptable:
      description: 'The operation could not retrieve or persist message data. For a send, the message may already have reached WhatsApp.'
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorResponse'
    RequestTimeout:
      description: Timed out while waiting for pairing.
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with the current resource or pairing state.
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorResponse'
    Gone:
      description: The pairing challenge has expired.
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: The request or file exceeds the permitted size.
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: The submitted media type is not supported.
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: The request cannot be processed in its current form or state.
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorResponse'
    InternalError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorResponse'
    UpstreamUnavailable:
      description: WhatsApp or a required service is unavailable.
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorResponse'
    MessageSent:
      description: Message sent synchronously and persisted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Accepted:
      description: Message accepted for asynchronous mentionAll processing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProcessingAcceptedResponse'
          example:
            statusCode: 202
            status: processing
            message: A mensagem foi aceita e esta sendo processada.
            processId: 019f4ec1-f9b1-7c33-a4ef-d47715cb29e4
            instanceName: codechat
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            mentionAllRequiresGroup:
              value:
                statusCode: 400
                error: bad-request
                code: MENTION_ALL_REQUIRES_GROUP
                messages:
                  - A opcao mentionAll somente pode ser utilizada em grupos.
            mentionAllUnsupported:
              value:
                statusCode: 400
                error: bad-request
                code: MENTION_ALL_NOT_SUPPORTED_FOR_MESSAGE_TYPE
                messages:
                  - A opcao mentionAll nao e suportada para este tipo de mensagem.
    ServiceUnavailable:
      description: WhatsApp unavailable or asynchronous processor unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            queueFull:
              value:
                statusCode: 503
                error: service-unavailable
                code: MESSAGE_PROCESSING_QUEUE_FULL
                messages:
                  - O servico de processamento de mensagens esta temporariamente ocupado.
            processorStopped:
              value:
                statusCode: 503
                error: service-unavailable
                code: MESSAGE_PROCESSOR_STOPPED
                messages:
                  - O servico de processamento de mensagens nao esta disponivel.
