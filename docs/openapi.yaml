      summary: Download message media
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
        - name: binary
          in: query
          required: false
          description: Return raw file bytes rather than multipart metadata and file.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/MediaDataRequest'
            examples:
              byDatabaseId:
                value:
                  id: 42
              byWhatsAppKey:
                value:
                  keyId: 3EB0123456789ABCDEF0
      responses:
        '200':
          description: 'Downloaded file and metadata, or raw bytes when binary=true.'
          headers:
            Content-Disposition:
              description: 'Inline filename when binary=true.'
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: 'private, no-store'
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            multipart/form-data:
              schema:
                type: object
                required:
                  - mediaType
                  - fileName
                  - size
                  - mimetype
                  - file
                properties:
                  mediaType:
                    type: string
                  fileName:
                    type: string
                  size:
                    type: string
                    description: JSON-encoded size metadata.
                  mimetype:
                    type: string
                  file:
                    type: string
                    format: binary
            '*/*':
              schema:
                type: string
                format: binary
                description: 'Raw file bytes with the detected Content-Type when binary=true.'
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
