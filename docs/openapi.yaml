            - video
            - audio
            - ptv
        caption:
          type: string
          nullable: true
        delay:
          type: integer
          format: int64
        presence:
          type: string
        quotedMessageId:
          type: integer
          format: int64
        quotedMessage:
          type: string
        mentionAll:
          type: boolean
        attachment:
          type: string
          format: binary
    SendWhatsAppAudioRequest:
      type: object
      required:
        - number
        - audioMessage
      properties:
        number:
          type: string
        options:
          $ref: '#/components/schemas/MessageOptions'
        audioMessage:
          type: object
          required:
            - audio
          properties:
            audio:
              type: string
              format: uri
    SendWhatsAppAudioFileRequest:
      type: object
      required:
        - number
        - attachment
      properties:
        number:
          type: string
        delay:
          type: integer
          format: int64
        presence:
          type: string
        quotedMessageId:
          type: integer
          format: int64
        quotedMessage:
          type: string
        mentionAll:
          type: boolean
        attachment:
          type: string
          format: binary
    SendContactRequest:
