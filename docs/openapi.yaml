      type: object
      properties:
        delay:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 300000
          description: Delay in milliseconds. The maximum is 300000 for WhatsApp voice notes and 120000 for other sends that support delay.
        presence:
          type: string
          nullable: true
          description: Use composing for text, links, images, documents, videos, contacts and locations. Use recording for audio and PTV. WhatsApp voice notes also accept paused.
        quotedMessageId:
          type: integer
          format: int64
          nullable: true
        quotedMessage:
          type: object
          nullable: true
          additionalProperties: true
        externalAttributes:
          type: object
          nullable: true
          additionalProperties: true
        mentionAll:
          type: boolean
          nullable: true
          default: false
          description: Mentions all current group participants when the message type supports ContextInfo.MentionedJID.
    SendTextRequest:
      allOf:
