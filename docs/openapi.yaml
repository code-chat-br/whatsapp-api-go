openapi: 3.0.3
info:
  title: whatsapp-go-api
  version: 1.0.0
  description: |
    HTTP API for managing WhatsApp instances, sending messages, working with chats and groups, and configuring webhooks.
    The HTTP request body limit is 2 MiB, including multipart boundaries and fields.
tags:
  - name: documentation
    description: Swagger UI and its OpenAPI specification.
  - name: health
    description: HTTP liveness and service readiness.
  - name: instance
    description: 'Instance management, authentication and WhatsApp pairing.'
  - name: webhook
    description: Instance webhook configuration.
  - name: message
    description: Outbound WhatsApp messages.
  - name: chat
    description: 'Number lookup, message history and chat operations.'
  - name: group
    description: WhatsApp group management.
paths:
  /swagger/:
    get:
      tags: [documentation]
      operationId: getSwaggerUI
      summary: Open the Swagger UI
      security: []
      responses:
        '200':
          description: Interactive Swagger documentation.
          content:
            text/html:
              schema:
                type: string
  /swagger/openapi.yaml:
    get:
      tags: [documentation]
      operationId: getOpenAPI
      summary: Get the OpenAPI specification
      security: []
      responses:
        '200':
          description: The OpenAPI 3.0 specification in YAML.
          content:
            application/yaml:
              schema:
                type: string
  /health:
    get:
      tags:
        - health
      operationId: getHealth
      summary: Check HTTP liveness
      security: []
      responses:
        '200':
          description: HTTP server is running.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /ready:
    get:
      tags:
        - health
      operationId: getReadiness
      summary: Check service readiness
      security: []
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ready
        '503':
          description: Service is not ready.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
  /instance/create:
    post:
      tags:
        - instance
      operationId: createInstance
      summary: Create an instance and issue its token
      security:
        - globalApiKey: []
        - globalApiKeyAlias: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/CreateInstanceRequest'
      responses:
        '201':
          description: Instance and initial bearer token.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/InstanceCreated'
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '409':
          '$ref': '#/components/responses/Conflict'
        '422':
          '$ref': '#/components/responses/UnprocessableEntity'
        '500':
          '$ref': '#/components/responses/InternalError'
    get:
      tags:
        - instance
      operationId: listInstancesLegacy
      summary: List instances using the legacy path
      security:
        - globalApiKey: []
        - globalApiKeyAlias: []
      parameters:
        - name: instanceName
          in: query
          required: false
          description: Filter by instance name.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Matching instances and their stored authentication records.
          content:
            application/json:
              schema:
                type: array
                items:
                  '$ref': '#/components/schemas/InstanceListItem'
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '422':
          '$ref': '#/components/responses/UnprocessableEntity'
        '500':
          '$ref': '#/components/responses/InternalError'
  /instance/fetchInstances:
    get:
      tags:
        - instance
      operationId: listInstances
      summary: List instances
      security:
        - globalApiKey: []
        - globalApiKeyAlias: []
      parameters:
        - name: instanceName
          in: query
          required: false
          description: Filter by instance name.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Matching instances and their stored authentication records.
          content:
            application/json:
              schema:
                type: array
                items:
                  '$ref': '#/components/schemas/InstanceListItem'
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '422':
          '$ref': '#/components/responses/UnprocessableEntity'
        '500':
          '$ref': '#/components/responses/InternalError'
  /instance/fetchInstance/{instanceName}:
    get:
      tags:
        - instance
      operationId: getInstance
      summary: Get an instance
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      responses:
        '200':
          description: Instance details and webhook configuration.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/InstanceDetails'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '500':
          '$ref': '#/components/responses/InternalError'
  /instance/connect/{instanceName}:
    get:
      tags:
        - instance
      operationId: connectQrCodeLegacy
      summary: Start or resume QR-code pairing
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      responses:
        '200':
          description: QR code or current connection state.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/QRCodeConnection'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '408':
          '$ref': '#/components/responses/RequestTimeout'
        '409':
          '$ref': '#/components/responses/Conflict'
        '500':
          '$ref': '#/components/responses/InternalError'
        '503':
          '$ref': '#/components/responses/UpstreamUnavailable'
    post:
      tags:
        - instance
      operationId: connectQrCode
      summary: Start or resume QR-code pairing
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      responses:
        '200':
          description: QR code or current connection state.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/QRCodeConnection'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '408':
          '$ref': '#/components/responses/RequestTimeout'
        '409':
          '$ref': '#/components/responses/Conflict'
        '500':
          '$ref': '#/components/responses/InternalError'
        '503':
          '$ref': '#/components/responses/UpstreamUnavailable'
  /instance/connect/{instanceName}/code/{phoneNumber}:
    get:
      tags:
        - instance
      operationId: connectPhone
      summary: Request a phone pairing code
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
        - name: phoneNumber
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            example: '5511999999999'
      responses:
        '200':
          description: Phone pairing code.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                properties:
                  code:
                    type: string
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '409':
          '$ref': '#/components/responses/Conflict'
        '500':
          '$ref': '#/components/responses/InternalError'
        '503':
          '$ref': '#/components/responses/UpstreamUnavailable'
  /instance/connect/{instanceName}/passkey/challenge:
    post:
      tags:
        - instance
      operationId: requestPasskeyChallenge
      summary: Request a WebAuthn challenge
      description: Returns the existing request ID and public key while the challenge is valid and unused.
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      responses:
        '200':
          description: Challenge for the active pairing session.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/PasskeyChallenge'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '409':
          '$ref': '#/components/responses/Conflict'
        '422':
          '$ref': '#/components/responses/UnprocessableEntity'
        '500':
          '$ref': '#/components/responses/InternalError'
        '503':
          '$ref': '#/components/responses/UpstreamUnavailable'
  /instance/connect/{instanceName}/passkey/assertion:
    post:
      tags:
        - instance
      operationId: submitPasskeyAssertion
      summary: Submit a WebAuthn assertion
      description: Submit the assertion for the active challenge. Passkey error identifiers are returned in the messages array.
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/PasskeyAssertionRequest'
      responses:
        '202':
          description: Assertion sent to WhatsApp. Pairing can still require confirmation.
          content:
            application/json:
              schema:
                type: object
                required:
                  - state
                  - message
                properties:
                  state:
                    type: string
                    example: AWAITING_CONFIRMATION
                  message:
                    type: string
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '409':
          '$ref': '#/components/responses/Conflict'
        '410':
          '$ref': '#/components/responses/Gone'
        '422':
          '$ref': '#/components/responses/UnprocessableEntity'
        '500':
          '$ref': '#/components/responses/InternalError'
        '503':
          '$ref': '#/components/responses/UpstreamUnavailable'
  /instance/connectionState/{instanceName}:
    get:
      tags:
        - instance
      operationId: getConnectionState
      summary: Get the WhatsApp connection state
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      responses:
        '200':
          description: Current connection state.
          content:
            application/json:
              schema:
                type: object
                required:
                  - state
                  - statusReason
                  - instanceName
                  - connectionStatus
                  - connected
                  - loggedIn
                  - ownerJid
                properties:
                  state:
                    type: string
                  statusReason:
                    type: integer
                    format: int32
                  instanceName:
                    type: string
                    minLength: 1
                    example: codechat
                  connectionStatus:
                    '$ref': '#/components/schemas/ConnectionStatus'
                  connected:
                    type: boolean
                  loggedIn:
                    type: boolean
                  ownerJid:
                    type: string
                    minLength: 1
                    example: '5511999999999@s.whatsapp.net'
                    nullable: true
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '500':
          '$ref': '#/components/responses/InternalError'
  /instance/refreshToken/{instanceName}:
    put:
      tags:
        - instance
      operationId: refreshInstanceToken
      summary: Rotate the instance bearer token
      description: Send the current token as both the bearer credential and the oldToken field.
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldToken
              properties:
                oldToken:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Replacement token.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/InstanceToken'
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '500':
          '$ref': '#/components/responses/InternalError'
  /instance/logout/{instanceName}:
    delete:
      tags:
        - instance
      operationId: logoutInstance
      summary: Log the instance out of WhatsApp
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      responses:
        '200':
          description: Logout result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - instanceName
                  - state
                  - connectionStatus
                  - message
                properties:
                  instanceName:
                    type: string
                    minLength: 1
                    example: codechat
                  state:
                    type: string
                  connectionStatus:
                    '$ref': '#/components/schemas/ConnectionStatus'
                  message:
                    type: string
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '500':
          '$ref': '#/components/responses/InternalError'
        '503':
          '$ref': '#/components/responses/UpstreamUnavailable'
  /instance/delete/{instanceName}:
    delete:
      tags:
        - instance
      operationId: deleteInstance
      summary: Delete an instance
      description: With force=true, related chats, messages, webhooks and contacts are deleted with the instance.
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
        - name: force
          in: query
          required: false
          description: Allow deletion when related application data exists.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Deletion result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - instanceName
                  - deleted
                  - forced
                  - message
                properties:
                  instanceName:
                    type: string
                    minLength: 1
                    example: codechat
                  deleted:
                    type: boolean
                  forced:
                    type: boolean
                  message:
                    type: string
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '500':
          description: Deletion failed. If force is false and related data exists, messages identifies the relationships blocking deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          '$ref': '#/components/responses/UpstreamUnavailable'
  /webhook/set/{instanceName}:
    put:
      tags:
        - webhook
      operationId: setWebhook
      summary: Create or update the instance webhook
      description: Omit events to keep the existing event flags. A nonempty object merges the supplied flags. An empty object clears them. When enabled is omitted it defaults to true.
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 500
                enabled:
                  type: boolean
                  default: true
                events:
                  '$ref': '#/components/schemas/WebhookEvents'
              additionalProperties: false
      responses:
        '200':
          description: Saved webhook configuration.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Webhook'
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '409':
          '$ref': '#/components/responses/Conflict'
        '500':
          '$ref': '#/components/responses/InternalError'
  /webhook/find/{instanceName}:
    get:
      tags:
        - webhook
      operationId: getWebhook
      summary: Get the instance webhook
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      responses:
        '200':
          description: Saved webhook configuration.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Webhook'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '500':
          '$ref': '#/components/responses/InternalError'
  /chat/whatsappNumbers/{instanceName}:
    post:
      tags:
        - chat
      operationId: lookupWhatsAppNumbers
      summary: Check whether numbers are registered on WhatsApp
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - numbers
              properties:
                numbers:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    example: '5511999999999'
                  minItems: 1
                  maxItems: 100
      responses:
        '200':
          description: Lookup result for each number.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - jid
                    - lid
                    - exists
                  properties:
                    jid:
                      type: string
                      minLength: 1
                      example: '5511999999999@s.whatsapp.net'
                    lid:
                      type: string
                      nullable: true
                    exists:
                      type: boolean
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '500':
          '$ref': '#/components/responses/InternalError'
        '503':
          '$ref': '#/components/responses/UpstreamUnavailable'
  /chat/findMessages/{instanceName}:
    post:
      tags:
        - chat
      operationId: findMessages
      summary: List stored messages with pagination
      description: The offset field is the page size. A lookup by where.id returns at most one record.
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/FindMessagesRequest'
      responses:
        '200':
          description: Page of messages and their recorded status updates.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/MessageList'
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '500':
          '$ref': '#/components/responses/InternalError'
  /chat/readMessages/{instanceName}:
    patch:
      tags:
        - chat
      operationId: readMessages
      summary: Mark messages as read
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/ReadMessagesRequest'
      responses:
        '200':
          description: Read receipt result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - read
                properties:
                  message:
                    type: string
                    example: Read messages
                  read:
                    type: string
                    enum:
                      - success
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '406':
          '$ref': '#/components/responses/NotAcceptable'
        '500':
          '$ref': '#/components/responses/InternalError'
        '503':
          '$ref': '#/components/responses/UpstreamUnavailable'
  /chat/archiveChat/{instanceName}:
    put:
      tags:
        - chat
      operationId: archiveChat
      summary: Archive or unarchive a chat
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/ArchiveChatRequest'
      responses:
        '204':
          description: Chat archive state updated.
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '500':
          '$ref': '#/components/responses/InternalError'
        '503':
          '$ref': '#/components/responses/UpstreamUnavailable'
  /chat/deleteMessage/{instanceName}:
    delete:
      tags:
        - chat
      operationId: deleteMessage
      summary: Delete a sent message for everyone
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
        - name: id
          in: query
          required: true
          description: Local database message ID.
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '204':
          description: Message deletion requested on WhatsApp.
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '406':
          '$ref': '#/components/responses/NotAcceptable'
        '500':
          '$ref': '#/components/responses/InternalError'
        '503':
          '$ref': '#/components/responses/UpstreamUnavailable'
  /chat/fetchProfilePictureUrl/{instanceName}:
    post:
      tags:
        - chat
      operationId: getProfilePictureUrl
      summary: Get a profile picture URL
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/RecipientFields'
      responses:
        '200':
          description: 'Profile picture URL, or null when no picture is available.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - profilePictureUrl
                properties:
                  profilePictureUrl:
                    type: string
                    format: uri
                    nullable: true
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
        '409':
          '$ref': '#/components/responses/Conflict'
        '500':
          '$ref': '#/components/responses/InternalError'
        '503':
          '$ref': '#/components/responses/UpstreamUnavailable'
  /chat/rejectCall/{instanceName}:
    post:
      tags:
        - chat
      operationId: rejectCall
      summary: Reject an incoming WhatsApp call
      security:
        - instanceBearer: []
      parameters:
        - '$ref': '#/components/parameters/InstanceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - callId
                - callFrom
              properties:
                callId:
                  type: string
                  minLength: 1
                callFrom:
                  type: string
                  minLength: 1
                  example: '5511999999999@s.whatsapp.net'
      responses:
        '204':
          description: Call rejected.
        '400':
          '$ref': '#/components/responses/InvalidInput'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          '$ref': '#/components/responses/Forbidden'
        '404':
          '$ref': '#/components/responses/NotFound'
